# Neon базасының күнделікті сақтық көшірмесі (Алматы уақытымен 04:00).
# Көшірме AES-256 құпия сөзбен шифрланады: репозиторий ашық болса да оны тек құпия сөзді білетін адам аша алады.
# Қажетті GitHub Secrets: DATABASE_URL, BACKUP_PASSPHRASE
name: Database backup

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "DATABASE_URL немесе BACKUP_PASSPHRASE орнатылмаған" >&2
            exit 1
          fi
          name="juzup-$(date -u +%Y%m%d-%H%M).dump"
          docker run --rm -e DATABASE_URL postgres:18 sh -c 'pg_dump "$DATABASE_URL" -Fc --no-owner --no-privileges' > "$name"
          test -s "$name"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$name" -out "$name.enc" -pass env:BACKUP_PASSPHRASE
          rm "$name"
          echo "FILE=$name.enc" >> "$GITHUB_ENV"
          ls -la "$name.enc"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
