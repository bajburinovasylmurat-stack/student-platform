# Тегін Render сервері 15 минут бос тұрса ұйықтайды: 10 минут сайын оятып тұрамыз,
# сонда сайт тез ашылады және таңғы/кешкі Telegram ескертулері уақытында кетеді.
# /api/health базаға тиіспейді, сондықтан базаның жүктемесін арттырмайды.
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: |
          curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 \
            https://student-platform-backend-h9zs.onrender.com/api/health
