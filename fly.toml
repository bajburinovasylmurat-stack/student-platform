# JUZUP: сайт + API бір машинада, база Neon-да (DATABASE_URL — fly secrets)
app = 'juzup'
primary_region = 'ord'

[build]

[env]
  PORT = '8080'
  PUBLIC_URL = 'https://juzup.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  # Таңғы/кешкі Telegram ескертулері үшін сервер ұйықтамауы керек
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
